<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NOVA — Think. Search. Go.</title>
  <desc id="desc">A dark editorial product cover for the NOVA AI browser new tab extension.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#152019"/>
      <stop offset=".52" stop-color="#0b0e0b"/>
      <stop offset="1" stop-color="#050605"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7bc796" stop-opacity=".1"/>
      <stop offset=".52" stop-color="#7bc796" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e8d9ad" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b201b"/>
      <stop offset="1" stop-color="#111411"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="840" cy="452" rx="612" ry="260" fill="none" stroke="#788079" stroke-opacity=".14" stroke-width="2" transform="rotate(-7 840 452)"/>
  <ellipse cx="840" cy="452" rx="612" ry="260" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="285 3560" stroke-dashoffset="-965" transform="rotate(-7 840 452)"/>
  <circle cx="1265" cy="243" r="12" fill="#67bf84" opacity=".12" filter="url(#glow)"/>
  <circle cx="1265" cy="243" r="4" fill="#77cd91"/>

  <g transform="translate(90 76)">
    <circle cx="17" cy="17" r="14" fill="none" stroke="#9aa29a" stroke-width="1.5"/>
    <path d="M5 21 29 9M18 3l3 11-11-2" fill="none" stroke="#9aa29a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    <text x="48" y="23" fill="#a7ada7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">NOVA</text>
  </g>

  <g transform="translate(232 212)">
    <text x="0" y="0" fill="#8b938b" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4">AI-NATIVE NEW TAB</text>
    <text x="0" y="92" fill="#f1f1ea" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="82" font-weight="650" letter-spacing="-4">Think. Search. Go.</text>
    <text x="3" y="139" fill="#909790" font-family="PingFang SC, Noto Sans CJK SC, Inter, sans-serif" font-size="25">一个输入框，通往 AI、搜索与整个网络。</text>
  </g>

  <g transform="translate(240 458)" filter="url(#shadow)">
    <rect width="1120" height="116" rx="29" fill="url(#glass)" stroke="#4b594d" stroke-width="2"/>
    <rect x="1" y="1" width="1118" height="114" rx="28" fill="none" stroke="#7fc28e" stroke-opacity=".13" stroke-width="5"/>
    <g transform="translate(34 37)">
      <circle cx="20" cy="21" r="17" fill="#202720" stroke="#4d5d4f"/>
      <path d="M12 22h16M18 15l-6 7 6 7M28 20h-9m3-7 6 7-6 7" fill="none" stroke="#82c895" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
      <text x="55" y="28" fill="#d8ddd7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="23" font-weight="600">ChatGPT</text>
      <path d="m166 18 7 7 7-7" fill="none" stroke="#858c85" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
      <line x1="205" y1="0" x2="205" y2="42" stroke="#323832"/>
      <text x="236" y="29" fill="#f1f1ea" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="25" font-weight="520">Ask anything…</text>
    </g>
    <g transform="translate(1013 37)">
      <rect width="72" height="42" rx="12" fill="#0b0d0b" stroke="#3c433c"/>
      <text x="17" y="27" fill="#aeb5ae" font-family="Inter, Arial, sans-serif" font-size="17">⌘ K</text>
    </g>
  </g>

  <g transform="translate(430 624)" font-family="Inter, Instrument Sans, Arial, sans-serif">
    <g><circle cx="21" cy="21" r="20" fill="#151915" stroke="#333b34"/><path d="M12 21h18m-5-6 6 6-6 6" fill="none" stroke="#7fc593" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><text x="50" y="27" fill="#b9bfb9" font-size="18">AI</text></g>
    <g transform="translate(160)"><circle cx="21" cy="21" r="20" fill="#151915" stroke="#333b34"/><circle cx="19" cy="19" r="7" fill="none" stroke="#d7b35f" stroke-width="1.8"/><path d="m24 24 7 7" stroke="#d7b35f" stroke-linecap="round" stroke-width="1.8"/><text x="50" y="27" fill="#b9bfb9" font-size="18">Search</text></g>
    <g transform="translate(362)"><circle cx="21" cy="21" r="20" fill="#151915" stroke="#333b34"/><path d="M14 13h14v16H14zM17 17h8M17 21h8M17 25h5" fill="none" stroke="#a8ada8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><text x="50" y="27" fill="#b9bfb9" font-size="18">Commands</text></g>
    <g transform="translate(602)"><circle cx="21" cy="21" r="20" fill="#151915" stroke="#333b34"/><path d="M12 17h18M12 25h13" stroke="#d98262" stroke-linecap="round" stroke-width="1.8"/><text x="50" y="27" fill="#b9bfb9" font-size="18">Private</text></g>
  </g>

  <text x="800" y="818" text-anchor="middle" fill="#676e67" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="16" letter-spacing="2">MANIFEST V3 · KEYBOARD FIRST · STORAGE ONLY</text>
</svg>
